name: Build and deploy Yomeyo

# Builds the full JMdict dictionary, publishes the installable web app, and
# packages the browser extension as a downloadable zip — so nothing has to be
# built by hand.
#
# GitHub Pages must be switched on once for this repository (the Actions token
# is not allowed to do it). Either choice works:
#   Settings -> Pages -> Source: "GitHub Actions"          (deployed by this workflow)
#   Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / root
# This workflow publishes both ways, so whichever you pick goes live. Until
# Pages is enabled, the build still runs and the extension zip is still
# produced as a workflow artifact.
#
# It can also publish to your own web host (cPanel or anything with FTP):
# add the CPANEL_FTP_* repository secrets described in the README and every
# push uploads the site there too. Without the secrets that step is skipped.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      common_dictionary:
        description: "Build only JMdict's common-words subset (smaller download, misses many compounds)"
        type: boolean
        default: false

permissions:
  contents: write # push the built site to the gh-pages branch
  pages: write
  id-token: write

concurrency:
  group: yomeyo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    env:
      # Present only when the repository is set up to publish to its own web
      # host; the step below keys off it. (Secrets cannot be read inside an
      # `if:` directly, so the host lands in the environment first.)
      CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build core library
        run: npm run build -w @yomeyo/core

      - name: Build JMdict dictionary
        env:
          # Raises the GitHub API rate limit when resolving the release asset.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.common_dictionary }}" = "true" ]; then
            node scripts/build-dict.mjs --common
          else
            node scripts/build-dict.mjs
          fi

      - name: Build kanji data (KANJIDIC2 + KanjiVG)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-kanji.mjs

      - name: Check dictionary size
        run: |
          SIZE=$(stat -c %s apps/web/public/dict/dict.bin)
          GZ=$(gzip -c apps/web/public/dict/dict.bin | wc -c)
          ENTRIES=$(node scripts/dict-info.mjs entries)
          KANJI=$(node -e "console.log(JSON.parse(require('fs').readFileSync('apps/web/public/kanji/index.json','utf8')).kanji.length)")
          STROKES=$(ls apps/web/public/kanji/strokes 2>/dev/null | wc -l)
          {
            echo "### Data"
            echo ""
            echo "- Dictionary: $ENTRIES entries, $(( SIZE / 1000000 )) MB raw, $(( GZ / 1000000 )) MB gzipped"
            echo "- Kanji: $KANJI characters, stroke order in $STROKES bucket files"
          } >> $GITHUB_STEP_SUMMARY
          # GitHub Pages rejects individual files over 100 MB.
          if [ "$SIZE" -gt 99000000 ]; then
            echo "::error::Dictionary exceeds the 100 MB GitHub Pages file limit"
            exit 1
          fi

      - name: Build web app
        env:
          # Optional. Set this repository secret to the Firebase project's web
          # config JSON and the deployed app offers "Sign in with Google"
          # straight away, with nothing to paste on each device. Without it
          # the app still works — cloud sync is simply off until someone
          # enters a config in Settings. The web config is not a secret (it
          # identifies the project; Firestore rules are what protect the
          # data), but keeping it in a secret means forks do not inherit it.
          VITE_FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: npm run build -w @yomeyo/web

      - name: Build browser extension
        run: npm run build -w @yomeyo/extension

      - name: Package extensions for download
        run: |
          for target in chromium firefox; do
            ( cd "apps/extension/dist/$target" && zip -qr "$GITHUB_WORKSPACE/yomeyo-extension-$target.zip" . )
            # Serve from the app site too, so each has a stable install URL.
            cp "yomeyo-extension-$target.zip" apps/web/dist/
            echo "- Extension ($target): $(du -h "yomeyo-extension-$target.zip" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          done
          # Keep the previous single-file name working as the Chromium build.
          cp yomeyo-extension-chromium.zip apps/web/dist/yomeyo-extension.zip

      - name: Upload extensions as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yomeyo-extension
          path: yomeyo-extension-*.zip
          if-no-files-found: error

      # Word audio: the app never holds the API key — a static site cannot
      # keep a secret. Instead the site ships audio.php, and the key is
      # written next to it here, from the AUDIO_API_KEY repository secret,
      # for the cPanel upload alone. Base64 sidesteps every quoting hazard a
      # key could pose. Without the secret, audio.php answers "unconfigured"
      # and the app uses the device voice.
      - name: Give the cPanel host its audio key
        if: env.CPANEL_FTP_HOST != ''
        env:
          AUDIO_API_KEY: ${{ secrets.AUDIO_API_KEY }}
        run: |
          if [ -n "$AUDIO_API_KEY" ]; then
            printf '<?php return base64_decode("%s");\n' "$(printf %s "$AUDIO_API_KEY" | base64 -w0)" > apps/web/dist/audio-key.php
            echo "Audio key packaged for the host."
          else
            echo "No AUDIO_API_KEY secret set - word audio will use the device voice."
          fi

      # The Anthropic key for generating fresh practice sentences, written
      # the same way: onto the cPanel upload only, never to Pages, never
      # into the repository.
      - name: Write the grammar key for the cPanel upload
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '<?php return base64_decode("%s");\n' "$(printf %s "$ANTHROPIC_API_KEY" | base64 -w0)" > apps/web/dist/grammar-key.php
            echo "Grammar generation enabled."
          else
            echo "No ANTHROPIC_API_KEY secret set - grammar uses its built-in sentences."
          fi

      # Who may publish gacha prize edits is decided by Firebase sign-in:
      # prizes-admin.php verifies each poster's ID token against the site's
      # own Firebase project and pins the first publisher's account. All the
      # server needs is the project id, taken from the same FIREBASE_CONFIG
      # secret the app already builds with — no extra secret to manage.
      - name: Write the firebase project id for the cPanel upload
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const raw = process.env.FIREBASE_CONFIG || "";
          let id = "";
          try { id = JSON.parse(raw).projectId || ""; } catch {}
          if (!id) {
            const m = raw.match(/projectId["' ]*[:=]["' ]*([\w-]+)/);
            if (m) id = m[1];
          }
          if (id) {
            fs.writeFileSync("apps/web/dist/firebase-project.php", `<?php return ${JSON.stringify(id)};\n`);
            console.log("Gacha publishing bound to Firebase project " + id);
          } else {
            console.log("No FIREBASE_CONFIG projectId - prize edits stay device-local.");
          }
          EOF

      # Publishing path 1: your own web host, over FTP(S) — how a cPanel host
      # gets updated on every push. Runs only when the CPANEL_FTP_* secrets
      # exist. Placed before the gh-pages publish, which git-inits inside
      # dist/ and would otherwise leave its droppings in the upload. Only
      # changed files are transferred after the first run (the action keeps a
      # sync-state file on the server), so pushes that touch no assets are
      # quick even though the dictionary is tens of megabytes.
      - name: Publish site to your own host (cPanel)
        if: env.CPANEL_FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          # FTPS (explicit TLS) is what cPanel offers by default; set the
          # CPANEL_FTP_PROTOCOL secret to "ftp" only if your host has no TLS.
          protocol: ${{ secrets.CPANEL_FTP_PROTOCOL || 'ftps' }}
          local-dir: apps/web/dist/
          # "./" is right for an FTP account whose directory *is* the target
          # folder (the recommended setup). Set CPANEL_FTP_DIR to a path like
          # "public_html/yomeyo/" if the account is rooted elsewhere.
          server-dir: ${{ secrets.CPANEL_FTP_DIR || './' }}

      # The FTP protocol cannot say *where* on the disk the account's root
      # is, so an upload can succeed into a folder the site never serves —
      # and the run looks green while the site stays empty. With the
      # CPANEL_SITE_URL secret set (e.g. https://duugu.moe/yomeyo/), this
      # fetches the just-uploaded service worker and fails loudly when the
      # URL does not serve this exact build. -k because a host mid-AutoSSL
      # setup has no valid certificate yet; the check is about placement.
      - name: Check the site actually serves the upload
        if: env.CPANEL_FTP_HOST != ''
        env:
          SITE_URL: ${{ secrets.CPANEL_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "No CPANEL_SITE_URL secret - skipping the after-deploy check."
            exit 0
          fi
          url="${SITE_URL%/}/sw.js"
          expected=$(grep -o 'const BUILD_ID = "[^"]*"' apps/web/dist/sw.js)
          served=$(curl -skL --max-time 30 "$url" | grep -o 'const BUILD_ID = "[^"]*"' || true)
          if [ "$served" = "$expected" ]; then
            echo "OK: $url serves this build (${expected})."
          else
            echo "::error::$url is not serving this build (wanted ${expected}, saw '${served:-nothing}'). The FTP account is rooted in a folder that URL does not serve - recreate the FTP account with its Directory set to the site folder, or set the CPANEL_FTP_DIR secret to the right path."
            exit 1
          fi

      # The key must exist nowhere but on that host. gh-pages and the Pages
      # artifact are public, so it comes back out of dist before they publish.
      - name: Remove the audio key from the public builds
        if: always() && env.CPANEL_FTP_HOST != ''
        run: rm -f apps/web/dist/audio-key.php apps/web/dist/grammar-key.php

      # Publishing path 2: a plain gh-pages branch. Always works with the
      # default token, and covers the "Deploy from a branch" Pages setting.
      - name: Publish site to the gh-pages branch
        run: |
          cd apps/web/dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Pushed the built site to the gh-pages branch."
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Publishing path 3: the GitHub Actions Pages pipeline. Skipped (without
      # failing the build) when Pages has not been enabled yet.
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload site for Pages deployment
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Note where the site was published
        if: steps.pages.outcome == 'success' && github.ref_name != github.event.repository.default_branch
        run: |
          {
            echo "### Site published to the \`gh-pages\` branch"
            echo ""
            echo "This is not the default branch, and GitHub only accepts Actions-based"
            echo "Pages deployments from the default branch — so the \`gh-pages\` branch is"
            echo "how this build reaches the web."
            echo ""
            echo "If **Settings → Pages → Source** is *Deploy from a branch* (\`gh-pages\`),"
            echo "the app is already live at"
            echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo ""
            echo "If it is set to *GitHub Actions* instead, merge to"
            echo "\`${{ github.event.repository.default_branch }}\` to publish, or switch the"
            echo "source to the \`gh-pages\` branch to publish from here."
          } >> $GITHUB_STEP_SUMMARY

      - name: Explain how to finish setup
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### One setting left to turn on"
            echo ""
            echo "The build succeeded and the site was pushed to the **gh-pages** branch,"
            echo "but GitHub Pages is not enabled yet and the Actions token is not allowed"
            echo "to enable it. Turn it on once, then re-run this workflow:"
            echo ""
            echo "**Settings → Pages → Source → \"GitHub Actions\"**"
            echo ""
            echo "(Or pick \"Deploy from a branch\" → \`gh-pages\` → \`/ (root)\` — the branch"
            echo "is already there, and that option needs no re-run.)"
            echo ""
            echo "The app will then be at **https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/**"
            echo ""
            echo "Meanwhile the extension zip is downloadable from this run's Artifacts."
          } >> $GITHUB_STEP_SUMMARY
          echo "::warning::GitHub Pages is not enabled — see the job summary for the one setting to flip."

  deploy:
    needs: build
    # The `github-pages` environment only accepts deployments from the default
    # branch; from anywhere else the job is rejected before it even starts, so
    # skip it rather than show a red build. On other branches the gh-pages
    # publish in the build job is the delivery path.
    if: >-
      needs.build.outputs.pages_ready == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summarize
        run: |
          {
            echo "## Yomeyo is live"
            echo ""
            echo "**App (install this on your phone):** ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "**Extension zip:** ${{ steps.deployment.outputs.page_url }}yomeyo-extension.zip"
            echo ""
            echo "On Android: open the app link in Chrome, then menu (⋮) → Add to Home screen."
          } >> $GITHUB_STEP_SUMMARY
