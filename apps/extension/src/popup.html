<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        width: 300px;
        background: #12121f;
        color: #eceaf4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        padding: 16px;
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: #9a97b0; font-size: 12px; margin-bottom: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
      .stats { display: flex; gap: 8px; margin: 10px 0; }
      .stat { flex: 1; background: #1c1c2e; border-radius: 10px; padding: 8px; text-align: center; }
      .stat b { display: block; font-size: 18px; }
      .stat span { color: #9a97b0; font-size: 11px; }
      label { display: block; color: #9a97b0; font-size: 11px; margin: 8px 0 4px; }
      input[type="url"], input[type="password"] {
        width: 100%; box-sizing: border-box;
        background: #262640; color: #eceaf4;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px; padding: 8px; font-size: 13px;
      }
      button {
        width: 100%; border: none; border-radius: 10px;
        background: #7c6cf0; color: #fff; padding: 10px;
        font-size: 13px; cursor: pointer; margin-top: 10px;
      }
      button.secondary { background: #262640; }
      .msg { font-size: 12px; color: #9a97b0; margin-top: 8px; min-height: 15px; }
      .msg.ok { color: #4cc38a; }
      .msg.error { color: #e5644b; }
      .switch { position: relative; width: 42px; height: 24px; }
      .switch input { display: none; }
      .slider {
        position: absolute; inset: 0; background: #262640;
        border-radius: 24px; cursor: pointer; transition: 0.2s;
      }
      .slider:before {
        content: ""; position: absolute; height: 18px; width: 18px;
        left: 3px; top: 3px; background: #9a97b0; border-radius: 50%; transition: 0.2s;
      }
      input:checked + .slider { background: #7c6cf0; }
      input:checked + .slider:before { transform: translateX(18px); background: #fff; }
      .hint { color: #9a97b0; font-size: 11px; line-height: 1.5; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>Yomeyo</h1>
    <div class="sub">Tap words → daily flashcards</div>

    <div class="row">
      <span>Tap-to-lookup mode</span>
      <label class="switch">
        <input type="checkbox" id="tap-mode" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="hint">Off: hold <b>Alt/Option</b> and click a word. On: every tap looks up (best on phones).</div>

    <div class="stats">
      <div class="stat"><b id="stat-total">–</b><span>saved words</span></div>
      <div class="stat"><b id="stat-dirty">–</b><span>unsynced</span></div>
    </div>

    <label for="sync-url">Sync server URL</label>
    <input type="url" id="sync-url" placeholder="https://your-server:8787" />
    <label for="sync-token">Token</label>
    <input type="password" id="sync-token" placeholder="shared secret" />
    <button id="sync-btn">Sync now</button>
    <div class="msg" id="msg"></div>

    <script src="popup.js"></script>
  </body>
</html>
